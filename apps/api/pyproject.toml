[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dataops-ai-api"
version = "0.1.0"
description = "DataOps AI modular monolith API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "email-validator>=2.1,<3",
  "fastapi>=0.115,<1",
  "kafka-python>=2.0.2,<3",
  "openai>=2.0,<3",
  "passlib[bcrypt]>=1.7.4,<2",
  "bcrypt<4.1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "PyJWT>=2.9,<3",
  "sqlalchemy>=2.0.35,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<9", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
